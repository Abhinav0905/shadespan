[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadespan"
version = "0.1.0"
description = "Catalog inclusivity audits for fashion e-commerce: render every garment on every skin tone with YouCam Apparel VTO, score the results, ship the fix."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kumar Abhinav" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "jinja2>=3.1",
  "pillow>=10.3",
  "numpy>=1.26",
  "cryptography>=42",
  "tenacity>=8.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
shadespan = "shadespan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shadespan.report" = ["templates/*.j2"]
"shadespan.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
